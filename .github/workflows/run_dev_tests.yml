name: Run check in dev

on:
  pull_request:
    branches:
      - dev
  merge_group:
    branches:
      - dev

jobs:
  linters:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.12' ]
    steps:
      - uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Run linters
        run: uv run ruff check . && uv run ruff format --check . && uv run codespell src examples tests
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]
        resolution: [ 'lowest-direct', 'highest' ]
    steps:
    - uses: actions/checkout@v3
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --group dev --group docs --resolution ${{ matrix.resolution }}
    - name: Run tests and coverage
      run: uv run pytest --cov=biodata_schema --cov=tests --cov-report=term-missing --cov-fail-under=100
