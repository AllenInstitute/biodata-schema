name: Update docs for dev PR

on:
  pull_request:
    branches:
      - dev

jobs:
  update_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.SERVICE_TOKEN }}
          ref: ${{ github.head_ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: uv sync --locked --group dev --group docs
      - name: Generate docs
        run: |
          uv run python src/biodata_schema/utils/docs/model_generator.py
          uv run python src/biodata_schema/utils/docs/registries_generator.py
          uv run python src/biodata_schema/utils/docs/doc_generator.py
          uv run sphinx-build -b html docs/source/ docs/build/html
      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "update docs"
          add: '["docs"]'
