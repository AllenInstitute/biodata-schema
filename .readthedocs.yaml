version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
    nodejs: "20"
  jobs:
    # Build the interactive React Flow schema diagram before Sphinx runs.
    pre_build:
      - npm --prefix diagram-app ci
      - npm --prefix diagram-app run build

python:
  install:
    - method: uv
      command: sync
      groups:
        - dev
        - docs

sphinx:
  # Path to your Sphinx configuration file.
  configuration: docs/source/conf.py
