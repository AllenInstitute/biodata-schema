[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "biodata-schema"
description = "A library that defines AIND data schema and validates JSON files."
license = {text = "MIT"}
requires-python = ">=3.10,<3.14"
classifiers = [
    "Programming Language :: Python :: 3"
]
readme = "README.md"
dynamic = ["version"]

dependencies = [
    'biodata-models>=1.0.1,<2',
    'pydantic>=2.7, <3',
    'pydantic-extra-types',
    'tzdata',
]

[dependency-groups]
dev = [
    'argparse',
    'codespell',
    'dictdiffer',
    'pydantic>=2.7, !=2.9.0, !=2.9.1',
    'pytest>=8.3',
    'pytest-cov>=6',
    'ruff>=0.11',
    'semver',
]

docs = [
    'autodoc_pydantic',
    'furo',
    'myst-parser',
    'openpyxl',
    'sphinx',
    'sphinx-jinja',
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "biodata_schema.__version__"}
readme = {file = ["README.md"]}

[tool.coverage.run]
omit = [
    "*__init__*",
    "*/biodata_schema/visualizations/*",
    "*/tests/test_diagram_builder.py",
    "*/biodata_schema/utils/schema_tree.py"
]
source = ["biodata_schema", "tests"]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:", "pragma: no cover"]
fail_under = 100

[tool.codespell]
skip = '.git,*.pdf,*.svg'
ignore-words-list = 'nd,DeviceC'

[tool.pytest.ini_options]
testpaths = ["tests"]
strict_config = true
strict_markers = true
markers = ["online: tests requiring external services"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["C901", "E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.mccabe]
max-complexity = 10
